const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
const fileInput=document.getElementById('file'),zoomInput=document.getElementById('zoom');
const img=new Image(), frame=new Image();
let userImg=null, zoom=1;
const CX=624, CY=630, R=425;

function draw(){
  ctx.clearRect(0,0,1536,1536);
  ctx.drawImage(frame,0,0,1536,1536);
  if(userImg){
    ctx.save();
    ctx.beginPath(); ctx.arc(CX,CY,R,0,Math.PI*2); ctx.clip();
    const iw=userImg.naturalWidth, ih=userImg.naturalHeight;
    const scale=Math.max((R*2)/iw,(R*2)/ih)*zoom;
    const w=iw*scale, h=ih*scale;
    ctx.drawImage(userImg,CX-w/2,CY-h/2,w,h);
    ctx.restore();
    // redraw frame so ring/logo/text stay above the photo
    ctx.drawImage(frame,0,0,1536,1536);
  }
}
frame.onload=draw; frame.src=frameSrc;
fileInput.addEventListener('change',e=>{
 const f=e.target.files[0]; if(!f)return;
 const u=URL.createObjectURL(f);
 const im=new Image();
 im.onload=()=>{userImg=im; zoom=1; zoomInput.value=1; draw(); URL.revokeObjectURL(u)};
 im.onerror=()=>alert('ছবিটি খোলা যাচ্ছে না। অন্য ছবি চেষ্টা করুন।');
 im.src=u;
});
zoomInput.addEventListener('input',()=>{zoom=Number(zoomInput.value);draw()});
document.getElementById('minus').onclick=()=>{zoom=Math.max(1,zoom-.1);zoomInput.value=zoom;draw()};
document.getElementById('plus').onclick=()=>{zoom=Math.min(3,zoom+.1);zoomInput.value=zoom;draw()};
document.getElementById('reset').onclick=()=>{zoom=1;zoomInput.value=1;draw()};

document.getElementById('download').onclick=()=>{
 if(!userImg){alert('আগে একটি ছবি আপলোড করুন।');return;}
 draw();
 canvas.toBlob(blob=>{
   if(!blob){alert('ডাউনলোড তৈরি করা যায়নি। আবার চেষ্টা করুন।');return;}
   const url=URL.createObjectURL(blob);
   const a=document.createElement('a');
   a.href=url; a.download='Mohim-Reunion-2027.png';
   a.style.display='none'; document.body.appendChild(a); a.click();
   setTimeout(()=>{a.remove();URL.revokeObjectURL(url)},1500);
 },'image/png');
};
