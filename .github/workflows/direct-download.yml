name: Apply direct PNG download
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append final mobile-safe download handler
        run: |
          cat >> index.html <<'HTML'

          <!-- FINAL-MOBILE-DOWNLOAD-FIX -->
          <script>
          (function(){
            const btn=document.getElementById('download');
            if(!btn) return;
            btn.onclick=async function(){
              if(!window.userImg && typeof userImg==='undefined'){alert('আগে একটি ছবি নির্বাচন করুন।');return;}
              const cvs=window.canvas || (typeof canvas!=='undefined' ? canvas : null);
              if(!cvs){alert('ছবি তৈরি করা যাচ্ছে না।');return;}
              const filename='mohim-reunion-2027.png';
              try{
                const blob=await new Promise((resolve,reject)=>cvs.toBlob(b=>b?resolve(b):reject(new Error('PNG তৈরি হয়নি')),'image/png'));
                const url=URL.createObjectURL(blob);
                const a=document.createElement('a');
                a.href=url; a.download=filename; a.rel='noopener';
                document.body.appendChild(a); a.click();
                setTimeout(()=>{a.remove();URL.revokeObjectURL(url)},60000);
              }catch(err){
                alert('ছবি ডাউনলোড করা যাচ্ছে না। Chrome দিয়ে আবার চেষ্টা করুন।');
              }
            };
          })();
          </script>
          HTML
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add final mobile PNG download fix [skip ci]"
          git push
