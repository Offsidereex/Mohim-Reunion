name: Permanent download fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/permanent-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Replace download handler
        run: |
          python3 - <<'PY2'
          from pathlib import Path
          import re
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          new = """document.getElementById('download').onclick=async()=>{
  if(!userImg){alert('আগে একটি ছবি নির্বাচন করুন।');return;}
  const filename='mohim-reunion-2027.png';
  try{
    if(window.showSaveFilePicker){
      const handle=await window.showSaveFilePicker({
        suggestedName:filename,
        types:[{description:'PNG Image',accept:{'image/png':['.png']}}]
      });
      const writable=await handle.createWritable();
      const blob=await new Promise((resolve,reject)=>{
        canvas.toBlob(b=>b?resolve(b):reject(new Error('PNG তৈরি হয়নি')),'image/png');
      });
      await writable.write(blob);
      await writable.close();
      return;
    }
    const blob=await new Promise((resolve,reject)=>{
      canvas.toBlob(b=>b?resolve(b):reject(new Error('PNG তৈরি হয়নি')),'image/png');
    });
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download=filename;
    a.rel='noopener';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),60000);
  }catch(err){
    if(err && err.name==='AbortError') return;
    try{
      const blob=await new Promise((resolve,reject)=>{
        canvas.toBlob(b=>b?resolve(b):reject(new Error('PNG তৈরি হয়নি')),'image/png');
      });
      const url=URL.createObjectURL(blob);
      const w=window.open(url,'_blank');
      if(!w) alert('ডাউনলোড ব্লক হয়েছে। ব্রাউজারের Download/Pop-up অনুমতি দিন।');
      setTimeout(()=>URL.revokeObjectURL(url),60000);
    }catch(e){
      alert('ছবি তৈরি করা যাচ্ছে না। Chrome/Edge দিয়ে আবার চেষ্টা করুন।');
    }
  }
};"""
          pattern = r"document\.getElementById\('download'\)\.onclick\s*=.*?\n};"
          s2, n = re.subn(pattern, new, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit("Download handler not found")
          p.write_text(s2, encoding="utf-8")
          PY2
      - name: Commit patched index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Permanent mobile PNG download fix"
          git push
