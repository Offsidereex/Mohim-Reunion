name: Fix PNG download
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix-download:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch download button
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          marker="<!-- DOWNLOAD-FIX-V2 -->"
          if marker in s:
              print("Download fix already present")
              raise SystemExit(0)
          patch=r'''<script>
          /* DOWNLOAD-FIX-V2 */
          (function(){
            const btn=document.getElementById('download');
            if(!btn) return;
            btn.onclick=async function(){
              const img=window.userImg || (typeof userImg!=='undefined' ? userImg : null);
              const cvs=window.canvas || (typeof canvas!=='undefined' ? canvas : null);
              if(!img || !cvs){ alert('আগে একটি ছবি নির্বাচন করুন।'); return; }
              try{
                const blob=await new Promise((resolve,reject)=>{
                  cvs.toBlob(b=>b?resolve(b):reject(new Error('PNG তৈরি হয়নি')),'image/png');
                });
                const file=new File([blob],'mohim-reunion-2027.png',{type:'image/png'});
                if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
                  try{ await navigator.share({files:[file],title:'মহিম ইন্সটিটিউশন পুনর্মিলন ২০২৭'}); return; }catch(e){}
                }
                const url=URL.createObjectURL(blob);
                const a=document.createElement('a');
                a.href=url;
                a.download='mohim-reunion-2027.png';
                a.target='_blank';
                a.rel='noopener';
                document.body.appendChild(a);
                a.click();
                a.remove();
                setTimeout(()=>URL.revokeObjectURL(url),60000);
              }catch(err){
                try{
                  const data=cvs.toDataURL('image/png');
                  const w=window.open();
                  if(w){
                    w.document.write('<!doctype html><title>মহিম পুনর্মিলন ২০২৭</title><style>body{margin:0;background:#222;text-align:center}img{max-width:100%;height:auto}</style><img src="'+data+'">');
                    w.document.close();
                  }else{
                    alert('ডাউনলোড বন্ধ আছে। ব্রাউজারের Download/Pop-up অনুমতি দিন।');
                  }
                }catch(e){
                  alert('ছবি তৈরি করা যাচ্ছে না। Chrome দিয়ে আবার চেষ্টা করুন।');
                }
              }
            };
          })();
          </script>'''
          if "</body>" not in s:
              raise SystemExit("No body tag found")
          s=s.replace("</body>",patch+"\n</body>",1)
          p.write_text(s,encoding="utf-8")
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix mobile PNG download [skip ci]"
          git push
